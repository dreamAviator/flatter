releases:
  - name: dev-linux
    jobs:

      - name: linux-appimage
        package:
          platform: linux
          target: appimage
          pre: echo "Starting appimage packaging..."
          post: echo "appimage packaging complete!"

      - name: linux-zip
        package:
          platform: linux
          target: zip
          pre: echo "Starting linux zip packaging..."
          post: echo "linux zip packaging complete!"


  - name: dev-android
    jobs:

      - name: android-apk
        package:
          platform: android
          target: apk
          pre: echo "Starting apk packaging..."
          post: echo "apk packaging complete!"


  - name: dev-windows
    jobs:

      #no certificate and right now no publishing through microsoft store, so no msix
